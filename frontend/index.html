<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocOps</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">D</span>
      <h1>DocOps</h1>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <section id="upload-section" class="card">
      <div id="drop-zone" class="drop-zone">
        <svg class="drop-icon" aria-hidden="true" viewBox="0 0 24 24" width="32" height="32">
          <path
            fill="currentColor"
            d="M12 2a1 1 0 0 1 1 1v10.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V3a1 1 0 0 1 1-1Zm-7 15a1 1 0 0 1 1 1v2h12v-2a1 1 0 1 1 2 0v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"
          />
        </svg>
        <p>Drag &amp; drop a PDF here, or</p>
        <button id="upload-button" type="button">
          <span class="btn-label">Choose PDF</span>
          <span class="spinner" hidden></span>
        </button>
        <input type="file" id="file-input" accept="application/pdf" hidden />
      </div>
    </section>

    <section id="document-info" class="card" hidden>
      <span class="doc-icon" aria-hidden="true">📄</span>
      <span id="doc-filename"></span>
      <span id="doc-chunk-count" class="muted"></span>
      <span id="doc-cached-badge" class="badge" hidden>cached</span>
    </section>

    <p id="error-message" class="error" hidden></p>

    <section id="chat-section" class="card" hidden>
      <div id="conversation" data-empty-hint="Ask your first question about this document below."></div>
      <form id="chat-form">
        <textarea
          id="question-input"
          placeholder="Ask a question about this document... (Enter to send, Shift+Enter for newline)"
          rows="2"
        ></textarea>
        <button type="submit" id="send-button">
          <span class="btn-label">Send</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
